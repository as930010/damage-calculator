name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:data
      - run: pnpm run build
      - run: pnpm run test:build
      - run: pnpm run test:production
      - run: pnpm run test:transfer
      - run: pnpm run test:profiles
      - run: pnpm run test:data-contract
      - run: pnpm run test:field-ids
      - run: pnpm run test:data-loading
      - run: pnpm run test:data-schema
      - run: pnpm run test:input-fields
      - run: pnpm run test:history
      - run: pnpm run test:evaluation
      - run: pnpm run test:catalog
      - run: pnpm run test:ui
      - run: pnpm run test:theme-isolation
      - run: pnpm run test:core
      - run: pnpm run test:buff
      - run: pnpm run test:score
      - run: pnpm run test:ice
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Pages artifact visibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages&per_page=1"
          for attempt in {1..8}; do
            count=$(timeout 5s gh api --method GET "$endpoint" --jq .total_count)
            case "$count" in
              1) echo "Found exactly one github-pages artifact for run $GITHUB_RUN_ID"; exit 0 ;;
              0) echo "github-pages artifact is not visible yet ($attempt/8)" ;;
              *) echo "::error::Expected one github-pages artifact for run $GITHUB_RUN_ID, found $count"; exit 1 ;;
            esac
            if (( attempt < 8 )); then sleep 6; fi
          done
          echo "::error::No github-pages artifact became visible for run $GITHUB_RUN_ID"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
