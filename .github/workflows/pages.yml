name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:data
      - run: pnpm run build
      - run: pnpm run test:build
      - run: pnpm run test:production
      - run: pnpm run test:transfer
      - run: pnpm run test:field-ids
      - run: pnpm run test:data-loading
      - run: pnpm run test:data-schema
      - run: pnpm run test:input-fields
      - run: pnpm run test:history
      - run: pnpm run test:evaluation
      - run: pnpm run test:catalog
      - run: pnpm run test:ui
      - run: pnpm run test:theme-isolation
      - run: pnpm run test:core
      - run: pnpm run test:buff
      - run: pnpm run test:ice
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
